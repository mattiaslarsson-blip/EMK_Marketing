<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tack! – EMK Marketing</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
<script>window.EMK_EVENT = location.search.indexOf('guide=1')>-1 ? 'CompleteRegistration' : 'Lead';</script>
<script src="emk-tracking.js"></script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14130F;color:#F2EEE4;font-family:'DM Sans',sans-serif;text-align:center;padding:24px}
.box{max-width:560px}
.dot{width:64px;height:64px;border-radius:50%;background:#DFA438;color:#14130F;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 26px}
h1{font-family:'DM Sans';font-weight:800;font-size:clamp(32px,5vw,46px);margin:0 0 14px;letter-spacing:-.02em}
p{color:rgba(242,238,228,.66);font-size:18px;line-height:1.6;margin:0 0 30px}
a{display:inline-block;background:#DFA438;color:#14130F;font-family:'DM Sans';font-weight:700;padding:15px 26px;border-radius:10px;text-decoration:none}

:root{--gold:#DFA438}
body{background:#111111!important;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(40% 45% at 18% 20%,rgba(60,90,120,.22),transparent 70%),
  radial-gradient(45% 50% at 85% 35%,rgba(223,164,56,.16),transparent 70%);filter:blur(20px)}
.emk-topnav{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .3s ease,box-shadow .3s ease,backdrop-filter .3s ease}
.emk-topnav .emk-nav{transition:padding .3s ease;display:grid;grid-template-columns:1fr auto 1fr;gap:24px;max-width:1280px}
.emk-nav__logo{justify-self:start}.emk-nav__links{justify-self:center;gap:32px}.emk-nav__cta--side{justify-self:end;text-decoration:none;font-size:14.5px}
@media (max-width:768px){.emk-topnav .emk-nav{grid-template-columns:auto 1fr auto;gap:16px}.emk-nav__links{justify-self:end}}
@media (max-width:560px){.emk-topnav .emk-nav{grid-template-columns:auto 1fr;gap:16px;padding:16px}.emk-nav__cta--side{display:none}.emk-nav__links{flex-wrap:nowrap;gap:16px}.emk-nav__links a{font-size:13.5px}}
.emk-topnav.is-scrolled{background:rgba(17,17,17,.78);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 1px 0 rgba(245,241,232,.08),0 16px 40px -24px rgba(0,0,0,.9)}
.emk-topnav.is-scrolled .emk-nav{padding-top:16px;padding-bottom:16px}
.emk-topnav.is-scrolled .emk-nav__links a{text-shadow:none}
.emk-nav{max-width:1280px;margin:0 auto;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.emk-nav__logo{display:block;line-height:0}
.emk-nav__logo img{height:40px;width:auto;display:block}
.emk-nav__links{display:flex;align-items:center;gap:24px}
.emk-nav__links a{color:rgba(245,241,232,.85);text-decoration:none;font-size:14.5px;font-weight:600;transition:color .2s;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.emk-nav__links a:hover{color:#fff}
.emk-nav__links a.is-active{color:var(--gold)}
.emk-nav__cta{border:1.5px solid var(--gold);color:var(--gold)!important;padding:8px 16px;border-radius:100px;font-weight:700;text-shadow:none!important;transition:background .2s,color .2s}
.emk-nav__cta:hover{background:var(--gold);color:#111111!important}
@media (max-width:768px){.emk-nav{padding:16px 16px}.emk-nav__logo img{height:32px}.emk-nav__links{gap:16px;flex-wrap:wrap;justify-content:flex-end}.emk-nav__links a{font-size:12.5px}.emk-nav__cta{padding:8px 16px}}
@media (max-width:374px){.emk-nav__logo img{height:28px}.emk-nav__links{gap:8px}.emk-nav__links a{font-size:11.5px}.emk-nav__cta{padding:8px 8px}}
.emk-topnav .emk-nav{font-family:'DM Sans',system-ui,sans-serif}
.emk-topnav a{text-decoration:none;background:none;padding:0;border-radius:0;font-family:inherit}
.emk-topnav .emk-nav__cta{padding:8px 16px;border-radius:100px}
.emk-topnav .emk-nav__cta:hover{background:var(--gold)}
#cta{border-radius:999px!important;padding:16px 32px!important}
</style>
</head>
<body>
<div class="emk-topnav">
  <nav class="emk-nav">
    <a href="/" class="emk-nav__logo"><img src="images/logos/emk-logo-gold.svg" alt="EMK Marketing"></a>
    <div class="emk-nav__links">
      <a href="/process">Så funkar det</a>
      <a href="/priser">Priser</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/om-oss">Om oss</a>
    </div>
    <a class="emk-nav__cta emk-nav__cta--side" href="/kontakt">Boka möte</a>
  </nav>
</div>
<div class="box">
  <div class="dot">✓</div>
  <h1 id="t">Tack! Vi hör av oss inom 12 timmar.</h1>
  <p id="p">Under tiden kan du kika på våra paket och fundera på vilka filmer ni behöver mest.</p>
  <a id="cta" href="/priser">Se paket och priser</a>
</div>
<script>
if(location.search.indexOf('guide=1')>-1){
  document.getElementById('t').textContent='Tack! Guiden är på väg till din inkorg.';
  document.getElementById('p').textContent='Du kan också ladda ner den direkt här. Vill ni ha en filmplan för just ert företag? Hör av er så går vi igenom den på 15 minuter.';
  var c=document.getElementById('cta'); c.href='guide-5-filmer.pdf'; c.setAttribute('download',''); c.textContent='Ladda ner guiden (PDF)';
}
</script>
</body>
</html>
